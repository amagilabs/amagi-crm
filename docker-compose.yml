# amagi-crm with PostgreSQL. Setup:
#   cp .env.example .env
#   docker build -t amagi-crm . && docker run --rm amagi-crm keygen --postgres >> .env
#   docker compose up -d
#   docker compose exec app amagi-crm user add admin --role admin
# The app listens on 127.0.0.1 only. Put a TLS reverse proxy in front before exposing it.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run keygen --postgres and append the output to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: amagi-crm
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD}@db:5432/crm
    ports:
      - "127.0.0.1:${AMAGI_CRM_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amagi-crm"
version = "0.1.0"
description = "Self-hosted CRM starter for small firms: contacts, deal pipeline, tasks, booking, with field-level encryption and a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AmagiLabs (Amagisolutionsgroup, Inc.)", email = "dev@amagisolutionsgroup.com" }]
keywords = ["crm", "self-hosted", "small-business", "law-firm", "encryption", "audit-log", "fastapi", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Intended Audience :: Legal Industry",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "SQLAlchemy>=2.0",
    "cryptography>=42",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/amagilabs/amagi-crm"
Source = "https://github.com/amagilabs/amagi-crm"
Issues = "https://github.com/amagilabs/amagi-crm/issues"

[project.scripts]
amagi-crm = "amagi_crm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amagi_crm = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
